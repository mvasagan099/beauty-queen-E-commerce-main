# CI Pipeline - Runs on every push and pull request
# Validates code quality, builds, and runs tests

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install API dependencies
        run: cd apps/api && npm ci
      - name: Install Web dependencies
        run: cd apps/web && npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate --schema=../../prisma/schema.prisma

      - name: Lint API
        run: cd apps/api && npx eslint "{src,test}/**/*.ts" --max-warnings 0

      - name: Lint Web
        run: cd apps/web && npx eslint . --max-warnings 0

      - name: Typecheck API
        run: cd apps/api && npx tsc --noEmit

      - name: Typecheck Web
        run: cd apps/web && npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install API dependencies
        run: cd apps/api && npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate --schema=../../prisma/schema.prisma

      - name: Run Unit Tests
        run: cd apps/api && npx jest --passWithNoTests --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install API dependencies
        run: cd apps/api && npm ci
      - name: Install Web dependencies
        run: cd apps/web && npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate --schema=../../prisma/schema.prisma

      - name: Build API
        run: cd apps/api && npm run build

      - name: Build Web
        run: cd apps/web && npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          tags: beauty-queen-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          tags: beauty-queen-web:${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker/Dockerfile
          push: false
          tags: beauty-queen-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install API dependencies
        run: cd apps/api && npm ci
      - name: Install Web dependencies
        run: cd apps/web && npm ci

      - name: Audit API dependencies
        run: cd apps/api && npm audit --audit-level=high || true
        continue-on-error: true

      - name: Audit Web dependencies
        run: cd apps/web && npm audit --audit-level=high || true
        continue-on-error: true

  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Nginx config
        run: |
          mkdir -p /tmp/ci-nginx-ssl
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /tmp/ci-nginx-ssl/privkey.pem \
            -out /tmp/ci-nginx-ssl/fullchain.pem \
            -days 1 -subj "/CN=localhost"
          docker run --rm \
            --add-host=web:127.0.0.1 \
            --add-host=api:127.0.0.1 \
            -v ${{ github.workspace }}/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v /tmp/ci-nginx-ssl:/etc/nginx/ssl:ro \
            nginx:1.27-alpine nginx -t

  e2e-web:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Web dependencies
        run: cd apps/web && npm ci

      - name: Install Playwright Chromium
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Build Web for E2E
        run: cd apps/web && NEXT_TELEMETRY_DISABLED=1 npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

      - name: Run Playwright E2E suite
        run: |
          cd apps/web
          npx next start -p 3000 &
          SERVER_PID=$!
          npx wait-on http://localhost:3000 -t 30000 || sleep 5
          BASE_URL=http://localhost:3000 npx playwright test --project=chromium
          TEST_EXIT=$?
          kill $SERVER_PID || true
          exit $TEST_EXIT

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
