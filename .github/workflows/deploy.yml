# Deploy Pipeline - Runs on push to main after CI passes
# Builds Docker images, pushes to registry, and deploys to server

name: Deploy

on:
  push:
    branches: [main]

# Only run if CI workflow succeeds
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/beauty-queen

jobs:
  ci-check:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: "Build"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ steps.meta.outputs.version }}
          build-args: NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/beauty-queen
            git pull origin develop
            
            # Update images
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy --schema=../../prisma/schema.prisma
            
            # Wait for health checks
            sleep 10
            
            # Smoke tests
            curl -sf http://localhost/api/health/live || exit 1
            curl -sf http://localhost/api/health/ready || exit 1
            curl -sf http://localhost/ || exit 1
            
            echo "Staging deployment successful"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Test staging API health
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf "${{ secrets.STAGING_URL }}/api/health"; then
              echo "API health check passed"
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

      - name: Test staging frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/")
          if [ "$STATUS" = "200" ]; then
            echo "Frontend check passed (status: $STATUS)"
          else
            echo "Frontend check failed (status: $STATUS)"
            exit 1
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, smoke-tests]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Create database backup before deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/beauty-queen
            MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            RETENTION_DAYS=30 \
            bash scripts/backup.sh /var/backups/beauty-queen

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/beauty-queen
            git pull origin main
            
            # Update images
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy --schema=../../prisma/schema.prisma
            
            # Wait for health checks
            sleep 15
            
            # Verify services
            curl -sf http://localhost/api/health/live || exit 1
            curl -sf http://localhost/api/health/ready || exit 1
            
            echo "Production deployment successful"

      - name: Post-deployment verification
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf "${{ secrets.PRODUCTION_URL }}/api/health"; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          echo "Production health check failed after deployment"
          exit 1
